[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_spreadsheet"]

[project]
name = "mcp-server-spreadsheet"
version = "0.3.2"
description = "MCP server for reading and writing spreadsheet files (.xlsx, .csv, .ods)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Marek Rost" }]
keywords = ["mcp", "spreadsheet", "xlsx", "csv", "ods", "duckdb", "sql"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp==1.28.0",
    "openpyxl==3.1.5",
    "duckdb==1.5.4",
    "odfpy==1.4.1",
]

[project.scripts]
mcp-server-spreadsheet = "mcp_server_spreadsheet.server:main"

[project.urls]
Repository = "https://github.com/marekrost/mcp-server-spreadsheet"

[dependency-groups]
dev = ["hatchling==1.30.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
